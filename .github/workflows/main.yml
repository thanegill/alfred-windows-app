name: Release

# Build a distributable .alfredworkflow and publish a GitHub release whenever a
# v* tag is pushed. workflow_dispatch is kept so the packaging step can be run
# manually for verification (it builds but does not release).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # info.plist carries no version, so stamp it from the tag (e.g. v0.2.2 ->
      # 0.2.2) so Alfred shows a version. Skipped on manual (non-tag) runs.
      - name: Stamp version from the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -c "import os, plistlib; p='info.plist'; d=plistlib.load(open(p,'rb')); d['version']=os.environ['TAG'].removeprefix('v'); plistlib.dump(d, open(p,'wb'))"

      - name: Build .alfredworkflow
        id: build
        # A .alfredworkflow is just a zip of the workflow's files with info.plist
        # at the root (-j flattens paths). Ship the workflow itself and skip the
        # dev-only and repo-meta files (test/, screenshot.png, .github, ...).
        run: |
          file="Windows-App-${{ github.ref_name }}.alfredworkflow"
          zip -j "$file" info.plist alfred_feedback.rb list_desktops.rb \
                         open_desktop.rb icon.png README.md LICENSE
          echo "workflow_file=$file" >> "$GITHUB_OUTPUT"

      - name: Create release and attach workflow
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.build.outputs.workflow_file }}
          generate_release_notes: true
